<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フレンドクイズ｜どれくらい知ってる？</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1f2937;background:linear-gradient(135deg,#fff7ed,#fdf2f8);min-height:100vh}.wrap{max-width:720px;margin:auto;padding:24px 16px 48px}.hero{text-align:center;padding:20px 8px}.badge{display:inline-block;background:#fff;border:1px solid #fed7aa;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:#c2410c}h1{font-size:clamp(30px,7vw,48px);line-height:1.15;margin:14px 0 8px}.lead{color:#6b7280;line-height:1.7}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 60px #7c2d120f}.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:18px}.progress{height:10px;background:#f3f4f6;border-radius:99px;overflow:hidden;flex:1}.bar{height:100%;background:linear-gradient(90deg,#f97316,#ec4899);transition:.25s}.count{font-size:13px;color:#6b7280}.q{font-size:23px;line-height:1.5}.options{display:grid;gap:11px}.opt{width:100%;text-align:left;border:1.5px solid #e5e7eb;background:#fff;border-radius:16px;padding:15px 16px;font-size:16px;cursor:pointer;display:flex;gap:10px}.opt.selected{border-color:#f97316;background:#fff7ed;box-shadow:0 0 0 3px #ffedd5}.letter{font-weight:800;color:#9a3412}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#f3f4f6}.primary{background:linear-gradient(90deg,#f97316,#ec4899);color:#fff;flex:1}.btn:disabled{opacity:.45}.hidden{display:none!important}.start,.result{text-align:center}.emoji{font-size:56px}.score{font-size:76px;font-weight:900;line-height:1;margin:16px 0 6px;background:linear-gradient(90deg,#f97316,#ec4899);-webkit-background-clip:text;color:transparent}.review{text-align:left;margin-top:22px;border-top:1px solid #eee;padding-top:14px}.reviewItem{padding:14px 0;border-bottom:1px solid #f3f4f6}.reviewItem strong{display:block;margin-bottom:6px}.ok{color:#16a34a;font-weight:800}.ng{color:#dc2626;font-weight:800}.correct{color:#166534;margin-top:4px;font-size:14px}@media(max-width:520px){.card{padding:18px}.q{font-size:20px}.actions{flex-direction:column-reverse}.btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">FRIEND QUIZ</span><h1>私のこと、どれくらい知ってる？</h1><p class="lead">全10問。友達なら何問わかる？</p></section><section class="card"><div id="start" class="start"><div class="emoji">🎯</div><h2>10問チャレンジ</h2><p>4択から1つ選んで進んでください。最後に点数と答え合わせが出ます。</p><button id="startBtn" class="btn primary">クイズをはじめる</button></div><div id="quiz" class="hidden"><div class="progressRow"><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div></div><h2 id="question" class="q"></h2><div id="options" class="options"></div><div class="actions"><button id="backBtn" class="btn secondary">← 前へ</button><button id="nextBtn" class="btn primary" disabled>次へ →</button></div></div><div id="result" class="result hidden"><div class="emoji">🎉</div><h2>結果発表！</h2><div id="score" class="score"></div><div>/ 10問</div><p id="message"></p><button id="retryBtn" class="btn primary">もう一度やる</button><div id="review" class="review"></div></div></section></main><script>const qs=[{q:'好きなスポーツは？',o:['サッカー','野球','バスケットボール','テニス'],a:1},{q:'卒業した中学校は？',o:['杵築中学校','鶴崎中学校','宗近中学校','大東中学校'],a:2},{q:'好きなお菓子は？',o:['チョコレート','ポテトチップス','せんべい','グミ'],a:1},{q:'好きなビールは？',o:['キリン一番搾り','サッポロ黒ラベル','ザ・プレミアム・モルツ','アサヒスーパードライ'],a:3},{q:'好きな動物は？',o:['猫','犬','うさぎ','ハムスター'],a:1},{q:'好きなボードゲームは？',o:['囲碁','オセロ','将棋','チェス'],a:2},{q:'寝るならどっち派？',o:['ベッド派','布団派','ソファ派','ハンモック派'],a:1},{q:'結婚したのは何歳？',o:['25歳','28歳','30歳','32歳'],a:1},{q:'兄弟は自分を含めて何人？',o:['2人','3人','4人','5人'],a:1},{q:'いとこは何人？',o:['7人','9人','11人','13人'],a:2}];let i=0,ans=Array(qs.length).fill(null);const $=id=>document.getElementById(id);function render(){$('count').textContent=`${i+1} / ${qs.length}`;$('bar').style.width=`${((i+1)/qs.length)*100}%`;$('question').textContent=qs[i].q;$('options').innerHTML='';qs[i].o.forEach((t,n)=>{const b=document.createElement('button');b.className='opt'+(ans[i]===n?' selected':'');b.innerHTML=`<span class="letter">${String.fromCharCode(65+n)}</span><span>${t}</span>`;b.onclick=()=>{ans[i]=n;render()};$('options').appendChild(b)});$('backBtn').disabled=i===0;$('nextBtn').disabled=ans[i]===null;$('nextBtn').textContent=i===qs.length-1?'結果を見る':'次へ →'}function finish(){const s=qs.reduce((n,q,k)=>n+(ans[k]===q.a?1:0),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=s;$('message').textContent=s===10?'完璧！本人レベル。':s>=8?'かなり知ってる！':s>=6?'なかなかの理解度！':s>=3?'まだ伸びしろあり。':'これからもっと知っていこう！';$('review').innerHTML='<h3>答え合わせ</h3>'+qs.map((q,k)=>`<div class="reviewItem"><strong>${k+1}. ${q.q}</strong><div class="${ans[k]===q.a?'ok':'ng'}">${ans[k]===q.a?'○ 正解':'× 不正解'}</div>${ans[k]===q.a?'':`<div class="correct">正解：${q.o[q.a]}</div>`}</div>`).join('')} $('startBtn').onclick=()=>{$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('backBtn').onclick=()=>{if(i>0){i--;render()}};$('nextBtn').onclick=()=>{if(ans[i]===null)return;if(i<qs.length-1){i++;render()}else finish()};$('retryBtn').onclick=()=>{i=0;ans=Array(qs.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();scrollTo(0,0)};</script></body></html>
